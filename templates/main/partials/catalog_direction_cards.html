{% for group in catalog_project_groups %}
<section class="catalog-v2-project-group" data-project-group="{{ group.key }}" aria-label="{{ group.title }}">
  <h2 class="catalog-v2-project-group-title">{{ group.title }}</h2>
  <div class="catalog-v2-project-cards">
    {% for direction in group.directions %}
    <a class="catalog-v2-direction-card" href="{{ direction.url }}" data-catalog-v2-target="{{ direction.id }}" data-direction-slug="{{ direction.id|cut:'direction:' }}">
      <img src="{{ direction.image }}"{% if direction.image_srcset %} srcset="{{ direction.image_srcset }}" sizes="(max-width: 720px) calc(100vw - 48px), 420px" width="{{ direction.image_width }}" height="{{ direction.image_height }}"{% endif %} alt="" loading="{% if forloop.parentloop.first and forloop.first %}eager{% else %}lazy{% endif %}" decoding="async">
      {% include "main/partials/catalog_badge.html" with node=direction %}
      <span class="catalog-v2-direction-overlay"><h3>{{ direction.title }}</h3></span>
    </a>
    {% endfor %}
  </div>
</section>
{% endfor %}
