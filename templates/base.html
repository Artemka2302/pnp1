{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ПНП — единый центр комплектации{% endblock %}</title>
  <meta name="description" content="{% block description %}Комплектация строительных объектов по разделам проекта: материалы, оборудование, производители и аналоги под спецификацию, сроки и бюджет.{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'index' %}" aria-label="ПНП">
      <img src="{% static 'assets/img/brand/pnp-logo-header-white-clean.png' %}" alt="ПНП">
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-label="Открыть меню">Меню</button>
    <nav class="site-nav" data-nav>
      <a href="{% url 'about' %}">О компании</a>
      <a href="{% url 'catalog' %}">Каталог</a>
      <a href="{% url 'vendors' %}">Производители</a>
      <a href="{% url 'partners' %}">Партнеры</a>
      <a href="{% url 'contacts' %}">Контакты</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div>
      <strong>ПНП</strong>
      <span>Единый центр комплектации строительных объектов</span>
    </div>
    <a href="mailto:info@pnp1.ru">info@pnp1.ru</a>
  </footer>

  <script src="{% static 'js/site.js' %}"></script>
</body>
</html>
